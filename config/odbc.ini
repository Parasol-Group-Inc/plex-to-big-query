# /etc/odbc.ini
# Plex ODBC data source configuration
#
# This file is copied into the Docker container at /etc/odbc.ini
# and read by unixODBC at runtime.
#
# CompanyCode is NOT set here — it is injected at runtime via
# Secret Manager and passed directly in the connection string
# inside main.py. This keeps the same image usable across
# test and production environments.

[ODBC Data Sources]
PlexProduction=Plex ERP Production
PlexTest=Plex ERP Test

# ── Production ────────────────────────────────────────────────────────────────
[PlexProduction]
Driver          = /usr/oaodbc81/lib64/ivoa27.so
Description     = Plex ERP Production
Host            = odbc.plex.com
Port            = 19995
ServerDataSource= ReportDataSource
Encrypted       = 1
UseLDAP         = 0
LoadBalancing   = 0
ConnectionRetryCount = 3
ConnectionRetryDelay = 5
CustomProperties=

# ── Test / staging ────────────────────────────────────────────────────────────
[PlexTest]
Driver          = /usr/oaodbc81/lib64/ivoa27.so
Description     = Plex ERP Test
Host            = test.odbc.plex.com
Port            = 19995
ServerDataSource= ReportDataSource
Encrypted       = 1
UseLDAP         = 0
LoadBalancing   = 0
ConnectionRetryCount = 3
ConnectionRetryDelay = 5
CustomProperties=

# ── ODBC driver manager settings ──────────────────────────────────────────────
[ODBC]
Trace           = 0
TraceFile       = /tmp/odbc_trace.log
TraceDll        = /usr/oaodbc81/lib64/ddtrc27.so
InstallDir      = /usr/oaodbc81
IANAAppCodePage = 4