# /etc/odbc.ini
# Plex ODBC data source configuration
#
# This file is copied into the Docker container at /etc/odbc.ini
# and read by unixODBC at runtime.
#
# For IAM token auth (PlexTest), the token placeholder PLEX_IAM_TOKEN is
# substituted at container startup by entrypoint.sh using $PLEX_ACCESS_TOKEN.
# For username/password auth (PlexProduction), CustomProperties stays empty
# and CompanyCode is injected via the connection string in main.py.

[ODBC Data Sources]
PlexProduction=Plex ERP Production
PlexTest=Plex ERP Test

# ── Production ────────────────────────────────────────────────────────────────
[PlexProduction]
Driver          = /usr/oaodbc81/lib64/ivoa27.so
Description     = Plex ERP Production
Host            = odbc.plex.com
Port            = 19995
ServerDataSource= ReportDataSource
Encrypted       = 1
UseLDAP         = 0
LoadBalancing   = 0
ConnectionRetryCount = 3
ConnectionRetryDelay = 5
CustomProperties=

# ── Test / staging ────────────────────────────────────────────────────────────
[PlexTest]
Driver          = /usr/oaodbc81/lib64/ivoa27.so
Description     = Plex ERP Test
Host            = vox.odbc.plex.com
Port            = 19995
ServerDataSource= ReportDataSource
Encrypted       = 1
UseLDAP         = 0
LoadBalancing   = 0
ConnectionRetryCount = 3
ConnectionRetryDelay = 5
CustomProperties=

# ── ODBC driver manager settings ──────────────────────────────────────────────
[ODBC]
Trace           = 0
TraceFile       = /output/odbc_trace.log
TraceDll        = /usr/oaodbc81/lib64/ddtrc27.so
InstallDir      = /usr/oaodbc81
IANAAppCodePage = 4