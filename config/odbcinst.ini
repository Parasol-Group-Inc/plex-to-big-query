# /etc/odbcinst.ini
# ODBC driver registration file
#
# This file is copied into the Docker container at /etc/odbcinst.ini
# and tells unixODBC where to find the Plex driver shared objects.
#
# The driver name in brackets must match exactly what is referenced
# in odbc.ini under the Driver= key.

# ── Plex ODBC driver (DataDirect OpenAccess SDK 8.1) ─────────────────────────
[DataDirect OpenAccess SDK 8.1]
Description     = DataDirect OpenAccess SDK 8.1 - Plex ERP
Driver          = /usr/oaodbc81/lib64/ivoa27.so
Setup           = /usr/oaodbc81/lib64/ivoa27.so
Driver64        = /usr/oaodbc81/lib64/ivoa27.so
FileUsage       = 1
DontDlClose     = 1

# ── Trace settings (unixODBC driver manager) ──────────────────────────────────
[ODBC]
Trace           = No
TraceFile       = /tmp/odbcinst_trace.log
ForceTrace      = No
Pooling         = No