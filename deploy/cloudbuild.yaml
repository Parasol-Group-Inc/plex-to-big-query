# deploy/cloudbuild.yaml
#
# Google Cloud Build pipeline for the Plex → BigQuery ETL job.
# Triggered automatically on push to main, or manually via:
#
#   gcloud builds submit --config deploy/cloudbuild.yaml .
#
# Substitution variables are set in the Cloud Build trigger config
# in the GCP console, or overridden at submit time with --substitutions.

substitutions:
  _GCP_REGION:    "us-central1"
  _AR_REPO:       "plex-pipeline"
  _CR_JOB:        "plex-etl"
  _CR_JOB_TEST:   "plex-etl-test"    # smoke test runs HERE, never on prod
  _IMAGE_NAME:    "etl"
  _ENV:           "prod"             # prod | test
  # Every plex-etl-* job shares this one image (main.py/email_utils.py are
  # identical across pipelines — only each job's REPORT_CONFIG_GCS_PATH env
  # var differs, set by Terraform). One build updates all of them. Keep this
  # list in sync with the google_cloud_run_v2_job resources in
  # terraform/main.tf — each of those has a `lifecycle { ignore_changes }`
  # on its image field specifically so this step is the thing that moves
  # it, not a stray `terraform apply`.
  _ALL_JOBS: "plex-etl plex-etl-test plex-etl-work-orders plex-etl-work-orders-test plex-etl-purchasing-open-orders plex-etl-purchasing-open-orders-test plex-etl-part-obsolescence plex-etl-part-obsolescence-test plex-etl-inventory-activity plex-etl-inventory-activity-test plex-etl-inventory-snapshot plex-etl-inventory-snapshot-test plex-etl-quality-nonconformance plex-etl-quality-nonconformance-test plex-etl-part-on-hand-inventory plex-etl-part-on-hand-inventory-test"

# Full image URL derived from substitutions
# e.g. us-central1-docker.pkg.dev/vox-nutrition-prod/plex-pipeline/etl:abc123
tags:
  - plex-etl
  - "${_ENV}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8          # faster builds — ODBC driver copy is heavy

steps:

  # ── 1. Fetch driver files from GCS into the build workspace ─────────────────
  # driver/ is gitignored so it's absent from the source tarball.
  # mkdir first — both cp and rsync require the destination to already exist.
  # Uses the same cloud-sdk image as the deploy/smoke-test steps below —
  # gsutil is being phased out of the default gcloud CLI bundle (Google
  # announced removal starting March 2027); gcloud storage is the
  # supported replacement and shares auth with the rest of this pipeline.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "fetch-driver"
    entrypoint: "bash"
    args:
      - "-c"
      - "mkdir -p driver && gcloud storage cp -r gs://${PROJECT_ID}-build-assets/plex-odbc-driver/* driver/"
    waitFor: ["-"]                   # start immediately

  # ── 2. Build Docker image ────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "--tag=${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "--tag=${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "--cache-from=${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "."
    waitFor:
      - "fetch-driver"

  # ── 3. Push image to Artifact Registry ───────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-sha"
    args:
      - "push"
      - "${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
    waitFor:
      - "build"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest"
    args:
      - "push"
      - "${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"
    waitFor:
      - "build"

  # ── 4. Update every plex-etl-* Cloud Run job with the new image ──────────────
  # One shared image, one deploy step, all jobs — this (not Terraform) is
  # the sole path that moves a job onto a new image; see the ignore_changes
  # note on _ALL_JOBS above and on each job resource in terraform/main.tf.
  # Always the immutable SHA tag, never ":latest" (that tag is pushed for
  # convenience/manual `docker pull` only — nothing deployed ever reads it).
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-all"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        IMAGE="${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
        for job in ${_ALL_JOBS}; do
          echo "=== Updating $job -> $IMAGE ==="
          gcloud run jobs update "$job" --image="$IMAGE" --region="${_GCP_REGION}"
        done
    waitFor:
      - "push-sha"

  # ── 5. Smoke test — run the TEST job only, never production ──────────────────
  # The test job writes to the PlexTest dataset, so a buggy build cannot
  # WRITE_TRUNCATE production tables. Trigger prod manually after verifying
  # the test run:  gcloud run jobs execute plex-etl --region=us-central1
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "smoke-test"
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "execute"
      - "${_CR_JOB_TEST}"
      - "--region=${_GCP_REGION}"
      - "--wait"                      # block until job completes or fails
    waitFor:
      - "deploy-all"

# ── Final image references ────────────────────────────────────────────────────
images:
  - "${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${SHORT_SHA}"
  - "${_GCP_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest"

# ── Build timeout ─────────────────────────────────────────────────────────────
# 20 minutes — ODBC driver copy + Docker build can be slow on first run
# with no layer cache available.
timeout: "1200s"