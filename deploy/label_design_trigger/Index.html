<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --ok:#1f7a3f; --bad:#b3261e; --run:#8a5a00; --bg:#fafafa; --accent:#5b2a86; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 18px; }
    .badge { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:2px; }
    .test { background:#eef3ff; color:#2a4a9b; } .prod { background:#fde8e6; color:var(--bad); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
    button { font: inherit; font-weight:600; background: var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 18px; cursor:pointer; width:100%; }
    button:disabled { background:#b9b2c2; cursor:not-allowed; }
    #msg { margin-top:10px; min-height:1.4em; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .running { color: var(--run); }
    table { width:100%; border-collapse: collapse; font-size:14px; }
    td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight:500; font-size:12px; }
    a { color: var(--accent); }
    .muted { color: var(--muted); font-size:13px; }
  </style>
</head>
<body>
<main>
  <h1>Label Design — run the sync <span id="env" class="badge"></span></h1>
  <p class="sub">Refreshes <b>label_design_report</b> from Plex now, instead of at the next scheduled run (09:30 / 13:30).</p>

  <div class="card">
    <button id="run" disabled>Loading…</button>
    <div id="msg"></div>
    <div class="muted" id="who"></div>
  </div>

  <div class="card">
    <b>Recent runs</b> <span class="muted">— refreshes every 20 s</span>
    <table id="execs"><tr><td class="muted">Loading…</td></tr></table>
  </div>

  <div class="card">
    <b>Started from this app</b>
    <table id="log"><tr><td class="muted">—</td></tr></table>
  </div>
</main>
<script>
  var btn = document.getElementById('run'), msg = document.getElementById('msg');
  function fmt(t) { return t ? new Date(t).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(s) {
    if (s.setupNeeded) { btn.textContent = 'Not set up'; msg.innerHTML = '<span class="bad">' + esc(s.setupNeeded) + '</span>'; return; }
    var env = document.getElementById('env');
    env.textContent = s.isProd ? 'PRODUCTION' : 'TEST'; env.className = 'badge ' + (s.isProd ? 'prod' : 'test');
    document.getElementById('who').textContent = s.canRun
      ? 'Signed in as ' + s.user + '. Runs are at least ' + s.cooldownMin + ' min apart.'
      : 'Signed in as ' + s.user + ' — view only. Ask an admin to add you to the allowlist.';
    var running = (s.executions || []).some(function (e) { return e.state === 'running'; });
    btn.disabled = !s.canRun || running;
    btn.textContent = running ? 'A run is in progress…' : 'Run the Label Design sync now';

    var ex = document.getElementById('execs');
    if (s.apiError) { ex.innerHTML = '<tr><td class="bad">' + esc(s.apiError) + '</td></tr>'; }
    else if (!(s.executions || []).length) { ex.innerHTML = '<tr><td class="muted">No runs yet.</td></tr>'; }
    else {
      ex.innerHTML = '<tr><th>Started</th><th>Result</th><th></th></tr>' + s.executions.map(function (e) {
        return '<tr><td>' + fmt(e.started) + '</td><td class="' + e.state + '">' + e.state +
               (e.finished ? ' · ' + fmt(e.finished) : '') + '</td><td><a href="' + esc(e.logUrl) + '" target="_blank">logs</a></td></tr>';
      }).join('');
    }
    var lg = document.getElementById('log');
    lg.innerHTML = (s.log || []).length ? '<tr><th>When</th><th>Who</th><th>What</th></tr>' + s.log.map(function (l) {
      return '<tr><td>' + fmt(l.at) + '</td><td>' + esc(l.who) + '</td><td class="' + (l.result === 'started' ? 'ok' : 'bad') + '">' +
             esc(l.result) + (l.detail ? ' — ' + esc(l.detail) : '') + '</td></tr>';
    }).join('') : '<tr><td class="muted">Nothing yet.</td></tr>';
  }

  function refresh() { google.script.run.withSuccessHandler(render).withFailureHandler(function (e) { msg.innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; }).getStatus(); }

  btn.addEventListener('click', function () {
    btn.disabled = true; btn.textContent = 'Starting…'; msg.textContent = '';
    google.script.run.withSuccessHandler(function (r) {
      msg.innerHTML = '<span class="' + (r.ok ? 'ok' : 'bad') + '">' + esc(r.message) + '</span>';
      refresh();
    }).withFailureHandler(function (e) { msg.innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; refresh(); }).runJob();
  });

  refresh(); setInterval(refresh, 20000);
</script>
</body>
</html>
