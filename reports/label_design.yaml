report_name: label_design
category: Sales
description: "VOX | Label Design queue for the Monday holding board — prod (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# ORIGIN: Jennilyn's Plex stored procedure "Label Design Report"
# (sproc338756_18319605_1407579), agreed 2026-09-11. Replaces a twice-daily
# manual loop — download from NetSuite, paste into a Google Sheet, check for
# duplicates by hand, upload the new rows to Monday.
#
# NOT a scorecard tile. It is an operational queue the sales and design teams
# work from, which is why it gets its own pipeline rather than riding
# sales_orders: it runs at 10:00 and 14:00 Mountain, not once overnight.
#
# Four of the eight tables this needs are already extracted by sales_orders
# (Sales_v_PO, _PO_Line, _Release, _PO_Status, Common_v_Customer,
# Sales_v_Order_Salesperson, Plexus_Control_v_Plexus_User). They are extracted
# AGAIN here on purpose: this job runs midday, hours after sales_orders ran
# overnight, and a label-design queue built on a 14-hour-old part list would
# miss exactly the new orders it exists to surface.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# CHANGE PROBE — added 2026-10-01, so this pipeline can run HOURLY.
#
# Two tiny queries that fingerprint the only thing that can produce a new
# Monday item: the set of release lines sitting on the 'Label Design' release
# status. When the fingerprint matches the last clean run's, main.py skips all
# 15 extractions below. Typical day: ~10 probes costing seconds, 1-3 real runs.
#
# Why the key SET and not a count or a MAX(Update_Date): a count misses
# one-in-one-out, and nothing guarantees Plex stamps Update_Date on a status
# change. A line entering the set changes the fingerprint; a line leaving it
# changes it too, which costs one needless run and no correctness.
#
# Why probing the release status is enough: the push only ever CREATES Monday
# items, never updates them, so a note or part attribute edited after an order
# was pushed could not reach the board anyway.
#
# The status label is matched exactly. If Plex ever renames it, the bind
# resolves to nothing, the probe is INCONCLUSIVE, and the full extraction runs
# — the probe can slow things down, never drop a change. Watch for that with:
#   SELECT * FROM <dataset>.probe_log WHERE outcome = 'inconclusive'
# ─────────────────────────────────────────────────────────────────────────────
probe:
  queries:
    - plex_view: Sales_v_Release_Status
      columns: [Release_Status_Key]
      filter: "WHERE t.Release_Status = 'Label Design'"
      bind: status_keys

    - plex_view: Sales_v_Release
      columns: [Release_Key, PO_Line_Key]
      filter: "WHERE t.Release_Status_Key IN ({status_keys})"

extractions:
  - plex_view: Sales_v_PO
    bq_table: raw_Sales_v_PO
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Line
    bq_table: raw_Sales_v_PO_Line
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Release
    bq_table: raw_Sales_v_Release
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Status
    bq_table: raw_Sales_v_PO_Status
    filter: ""
    date_col: ""

  # New — not extracted anywhere else in the repo before 2026-09-11.
  - plex_view: Sales_v_Release_Status
    bq_table: raw_Sales_v_Release_Status
    filter: ""
    date_col: ""

  # Priority lookup — added 2026-10-07 for the Monday Priority column. Resolves
  # Sales_v_Release.Priority_Key (the per-line Priority dropdown in the Plex
  # sales-order screen) to its word. Part_v_Priority, NOT Sales_v_Priority —
  # the latter replicates empty on this tenant; the word is Part_v_Priority's
  # Description column. Small code table, pulled whole.
  - plex_view: Part_v_Priority
    bq_table: raw_Part_v_Priority
    filter: ""
    date_col: ""

  # The Job Note. This was the hard part of the original stored procedure to
  # locate, so it is extracted whole rather than filtered at source — the
  # Note_Type filter lives in the SQL where it can be seen and changed.
  - plex_view: Sales_v_PO_Line_Note
    bq_table: raw_Sales_v_PO_Line_Note
    filter: ""
    date_col: ""

  - plex_view: Part_v_Customer_Part
    bq_table: raw_Part_v_Customer_Part
    filter: ""
    date_col: ""

  # Part master — added 2026-09-25 for the "Plex Part URL" Monday column,
  # whose link needs Part_No and Revision alongside Part_Key. sales_orders
  # already extracts this overnight; it is pulled again here for the same
  # reason as the tables above (a part created this morning must be linkable).
  - plex_view: Part_v_Part
    bq_table: raw_Part_v_Part
    filter: ""
    date_col: ""

  # Flat BOM — added 2026-09-29 for Bottle Material (the bottle component's
  # name, two levels under the finished good). sales_orders pulls it overnight;
  # pulled again here so a finished good set up this morning has its bottle.
  - plex_view: Part_v_Flat_BOM
    bq_table: raw_Part_v_Flat_BOM
    filter: ""
    date_col: ""

  - plex_view: Common_v_Customer
    bq_table: raw_Common_v_Customer
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Order_Salesperson
    bq_table: raw_Sales_v_Order_Salesperson
    filter: ""
    date_col: ""

  - plex_view: Plexus_Control_v_Plexus_User
    bq_table: raw_Plexus_Control_v_Plexus_User
    filter: ""
    date_col: ""

  # Part Attributes — added 2026-09-16, per Jennilyn. A part-level "spec
  # sheet" of dropdown answers (Bottle Material, and a new Regulatory
  # attribute she is setting up for Prop 65/Organic/GMO-Free) that today gets
  # typed into Monday by hand instead of read from Plex. Confirmed with her
  # (2026-09-14 meeting): only ONE value per attribute per part — needing more
  # than one regulatory flag at once is handled by Plex's own dropdown having
  # pre-defined COMBINED entries ("Prop 65 + Organic"), not by multiple rows
  # here. See reports/sql/label_design_view.sql for how these two are joined.
  #
  # NOT YET POPULATED as of 2026-09-16 — Jennilyn: "we haven't made any [part
  # attributes] to apply to labels yet." These extractions are added ahead of
  # her uploading real test data, so the pull is ready the moment she does.
  - plex_view: Part_v_Attribute
    bq_table: raw_Part_v_Attribute
    filter: ""
    date_col: ""

  - plex_view: Part_v_Part_Attribute
    bq_table: raw_Part_v_Part_Attribute
    filter: ""
    date_col: ""

bq_view:
  - name: label_design_report
    display_name: "Label Design Queue"
    sql_file: gs://voxdatalake-report-configs/sql/label_design_view.sql
