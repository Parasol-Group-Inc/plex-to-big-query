report_name: part_lot
category: Quality
description: "Vox | Part Lot Attribute specs + Lot inheritance settings — prod (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# Jennilyn, 2026-10-21: "I need a table of these in BigQuery. Most parts have a
# table like this attached to them" (Plex: Part > Part Lot Attributes), and the
# Lot No / Best By / Attribute inheritance settings from the part's Lot
# Management box, "only for active parts ... just a table so we can see gaps".
#
# Two views, both built in BigQuery from the raw tables below:
#   part_lot_attribute_specs_report  one row per active part x active attribute,
#                                    columns as on the Part Lot Attributes screen
#   part_lot_inheritance_report      one row per active part: lot settings and
#                                    what each kind of inheritance comes from
#
# THE ATTRIBUTE NAME is reached through the template:
#   Part_v_Part_Lot_Attribute.Lot_Attribute_Template_Key
#     -> Part_v_Lot_Attribute_Template.Attribute_Key -> Common_v_Attribute.Attribute_Code
# Part_v_Part_Lot_Attribute.Attribute_Key is NULL in practice, and
# Part_v_Attribute (label_design's attribute master) is a different list.
# Verified in Plex SQL Developer on 2026-10-21: part 12149-01VOXNU-1 Rev 00
# gives the 34 attributes on its screen.
#
# PAGING: the attribute table and its three child tables are 250k-325k rows
# each, so they are pulled in keyset pages (page_key). No first-run special
# case: every run is a full refresh, same as part_routing.
#
# SHARED TABLES: Part_v_Part and Part_v_Part_Group are also extracted, unfiltered,
# by other pipelines into the same raw_* tables. Pulled again here on purpose:
# the change probe can only vouch for tables this config extracts.
#
# Docs: docs/reports/part_lot_attribute_specs_report.md and
# docs/reports/part_lot_inheritance_report.md.
# ─────────────────────────────────────────────────────────────────────────────

# Change probe — see main.py and docs/PROBE_BUILD_PLAN.md. The spec tables have
# only an Add_Date, so an edit in place is caught by the 4 AM full run.
probe_mode: auto

extractions:
  # Part master — number, revision, name, type, status (the 'Active' filter)
  - plex_view: Part_v_Part
    bq_table: raw_Part_v_Part
    filter: ""
    date_col: ""
    probe: [Updated_Date, Part_Key]

  # Part group lookup
  - plex_view: Part_v_Part_Group
    bq_table: raw_Part_v_Part_Group
    filter: ""
    date_col: ""
    probe: [Part_Group_Key]

  # One row per part x attribute. Inactive rows are retired versions of an
  # attribute (250k total, 150k active on 2026-10-21), so only active ones.
  - plex_view: Part_v_Part_Lot_Attribute
    bq_table: raw_Part_v_Part_Lot_Attribute
    filter: "WHERE Active = 1"
    date_col: ""
    probe: [Update_Date, Part_Lot_Attribute_Key]
    page_key: Part_Lot_Attribute_Key
    page_size: 25000

  # Template — the attribute, its group, sort order and default display type
  - plex_view: Part_v_Lot_Attribute_Template
    bq_table: raw_Part_v_Lot_Attribute_Template
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Attribute_Template_Key]

  # Attribute master — Attribute_Code is the "Lot Attribute Code" on screen
  - plex_view: Common_v_Attribute
    bq_table: raw_Common_v_Attribute
    filter: ""
    date_col: ""
    probe: [Update_Date, Attribute_Key]

  # Group lookup ("Receiving Inspection", "Finished Goods", ...)
  - plex_view: Part_v_Lot_Attribute_Group
    bq_table: raw_Part_v_Lot_Attribute_Group
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Attribute_Group_Key]

  # Display type lookup — "Text - Values", "Numeric - Maximum/Minimum", ...
  - plex_view: Part_v_Part_Lot_Attribute_Display_Type
    bq_table: raw_Part_v_Part_Lot_Attribute_Display_Type
    filter: ""
    date_col: ""
    probe: [Update_Date, Part_Lot_Attribute_Display_Type_Key]

  # Allowed answers for list attributes; Success = 1 are the passing ones
  # shown on screen (~325k rows).
  - plex_view: Part_v_Part_Lot_Attribute_List_Specification
    bq_table: raw_Part_v_Part_Lot_Attribute_List_Specification
    filter: ""
    date_col: ""
    probe: [Add_Date, Part_Lot_Attribute_List_Specification_Key]
    page_key: Part_Lot_Attribute_List_Specification_Key
    page_size: 25000

  # Limits for numeric attributes (low / high / target)
  - plex_view: Part_v_Part_Lot_Attribute_Numeric_Specification
    bq_table: raw_Part_v_Part_Lot_Attribute_Numeric_Specification
    filter: ""
    date_col: ""
    probe: [Add_Date, Part_Lot_Attribute_Numeric_Specification_Key]
    page_key: Part_Lot_Attribute_Numeric_Specification_Key
    page_size: 25000

  # Default value for free-text attributes
  - plex_view: Part_v_Part_Lot_Attribute_Text_Specification
    bq_table: raw_Part_v_Part_Lot_Attribute_Text_Specification
    filter: ""
    date_col: ""
    probe: [Add_Date, Part_Lot_Attribute_Text_Specification_Key]
    page_key: Part_Lot_Attribute_Text_Specification_Key
    page_size: 25000

  # Test method per part attribute, and whether it is required (~250k)
  - plex_view: Part_v_Part_Lot_Attribute_Test_Method
    bq_table: raw_Part_v_Part_Lot_Attribute_Test_Method
    filter: ""
    date_col: ""
    probe: [Add_Date, Part_Lot_Attribute_Test_Method_Key]
    page_key: Part_Lot_Attribute_Test_Method_Key
    page_size: 25000

  # Test method lookup
  - plex_view: Part_v_Lot_Attribute_Test_Method
    bq_table: raw_Part_v_Lot_Attribute_Test_Method
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Attribute_Test_Method_Key]

  # How each attribute prints on the COA (~250k)
  - plex_view: Part_v_Part_Lot_Attribute_Report
    bq_table: raw_Part_v_Part_Lot_Attribute_Report
    filter: ""
    date_col: ""
    probe: [Add_Date, Part_Lot_Attribute_Report_Key]
    page_key: Part_Lot_Attribute_Report_Key
    page_size: 25000

  # COA display lookup
  - plex_view: Part_v_Lot_Attribute_Report_Display_Type
    bq_table: raw_Part_v_Lot_Attribute_Report_Display_Type
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Attribute_Report_Display_Type_Key]

  # Unit lookup
  - plex_view: Common_v_Unit
    bq_table: raw_Common_v_Unit
    filter: ""
    date_col: ""
    probe: [Unit_Key]

  # ── Lot inheritance (Lot Management box) ──────────────────────────────────
  # Lot No: an override row means the lot number comes from a component;
  # no row means Plex generates it from the lot format.
  - plex_view: Part_v_Part_Operation_Lot_No_Inheritance_Override
    bq_table: raw_Part_v_Part_Operation_Lot_No_Inheritance_Override
    filter: ""
    date_col: ""
    probe: [Update_Date, Part_Operation_Lot_No_Inheritance_Override_Key]

  # Which component the lot number is taken from
  - plex_view: Part_v_Part_Operation_Lot_No_Inheritance_Override_Component_Part
    bq_table: raw_Part_v_Part_Operation_Lot_No_Inheritance_Override_Component_Part
    filter: ""
    date_col: ""
    probe: [Update_Date, Part_Operation_Lot_No_Inheritance_Override_Component_Part_Key]

  # Best By date inheritance
  - plex_view: Part_v_Part_Operation_Lot_Date_Inheritance
    bq_table: raw_Part_v_Part_Operation_Lot_Date_Inheritance
    filter: ""
    date_col: ""
    probe: [Update_Date, Part_Operation_Lot_Date_Inheritance_Key]

  # Attribute inheritance: one row per part x template x component (~128k)
  - plex_view: Part_v_Part_Operation_Lot_Attribute_Inheritance
    bq_table: raw_Part_v_Part_Operation_Lot_Attribute_Inheritance
    filter: ""
    date_col: ""
    probe: [Update_Date, Part_Operation_Lot_Attribute_Inheritance_Key]
    page_key: Part_Operation_Lot_Attribute_Inheritance_Key
    page_size: 25000

  # Lot Required / Lot Replenishable
  - plex_view: Part_v_Part_Inventory_Attributes
    bq_table: raw_Part_v_Part_Inventory_Attributes
    filter: ""
    date_col: ""
    probe: [Part_Key]

  # Part -> lot format (e.g. ADYYMMDD)
  - plex_view: Part_v_Part_Lot_Format
    bq_table: raw_Part_v_Part_Lot_Format
    filter: ""
    date_col: ""
    probe: [Part_Lot_Format_Key]

  # Lot format lookup
  - plex_view: Part_v_Lot_Format
    bq_table: raw_Part_v_Lot_Format
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Format_Key]

bq_view:
  - name: part_lot_attribute_specs_report
    display_name: "Part Lot Attribute Specs"
    sql_file: gs://voxdatalake-report-configs/sql/part_lot_attribute_specs_view.sql
  - name: part_lot_inheritance_report
    display_name: "Part Lot Inheritance"
    sql_file: gs://voxdatalake-report-configs/sql/part_lot_inheritance_view.sql
