report_name: part_on_hand_inventory
description: "VOX | Part on-hand inventory (Available Inventory) — prod (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# ORIGIN: built to cover the "Available Inventory" column of a manually
# maintained "MFG Job Schedule" tracking spreadsheet. See
# docs/MFG_JOB_SCHEDULE_BUILD_PLAN.md.
#
# On-hand inventory in this Plex tenant is NOT under the Warehouse module
# (Warehouse_v_Part_Quantity, the intuitively-named guess, does not exist —
# confirmed live: "Base table ... not found"). It lives under the Part
# module: Part_v_Container is the real physical-container-level carrier of
# on-hand quantity (Part_Key, Quantity, Location, Container_Status, Active).
# Confirmed live against vox.test.odbc.plex.com 2026-08-11.
#
# HOW TO EDIT THIS REPORT (no deployment required):
#   Change filter → update the filter field below, save this file to GCS
#   Change SQL    → edit reports/sql/part_on_hand_inventory_view.sql and save to GCS
# ─────────────────────────────────────────────────────────────────────────────

extractions:
  - plex_view: Part_v_Container
    bq_table: raw_Part_v_Container
    filter: ""
    date_col: ""

  - plex_view: Part_v_Container_Status
    bq_table: raw_Part_v_Container_Status
    filter: ""
    date_col: ""

# Part_v_Part is intentionally NOT extracted here — reuse raw_Part_v_Part
# from the sales_orders pipeline (same shared-table rule as work_orders.yaml).

bq_view:
  name: part_on_hand_inventory_report
  sql_file: gs://voxdatalake-report-configs/sql/part_on_hand_inventory_view.sql
