report_name: quality_nonconformance
category: Quality
description: "VOX | Quality non-conformance (NC) records — prod (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# ORIGIN: built to cover the "NC #" column of a manually maintained "MFG Job
# Schedule" tracking spreadsheet. See docs/MFG_JOB_SCHEDULE_BUILD_PLAN.md.
#
# Schema confirmed live against vox.test.odbc.plex.com 2026-08-11.
# Problem_Category, Problem_Status, Problem_Type, and Defect_Type are all
# INLINE text columns directly on Quality_v_Problem — same pattern already
# confirmed on Part_v_Part.Part_Status (no "_Key" suffix = inline text, not
# a foreign key). Quality_v_Problem_Category / _Problem_Status /
# _Problem_Nonconformance are standalone reference tables of valid values
# (like Part_v_Part_Status), not per-record join targets — so no extra
# lookup extraction is needed here.
#
# LIMITATION: Quality_v_Problem has no Job_Key / Job_Op_Key column — an NC
# record links to a Part (and optionally a Workcenter/Building), not to a
# specific job. Cross-referencing an NC to a row on the manual job schedule
# requires matching by part_no + date proximity, not a join key — same
# caveat as the NetSuite Job # correlation documented in the build plan.
#
# PARTIAL FIX added 2026-08-18: Quality_v_Deviation DOES carry Job_Key (via
# junction tables Deviation_Job / _Problem / _Part / _Workcenter) — see
# catalog/plex_quality_views_catalog.md "Deviations" section. Added below as
# quality_deviation_report. UNCONFIRMED whether every Problem/NC gets a
# linked Deviation, or only ones needing a documented workaround — validate
# once real data lands (load begins 2026-08-24) before treating this as the
# full NC-to-job answer. Until then, quality_nonconformance_report above
# still has no job correlation of its own.
#
# HOW TO EDIT THIS REPORT (no deployment required):
#   Change filter → update the filter field below, save this file to GCS
#   Change SQL    → edit reports/sql/quality_nonconformance_view.sql and save to GCS
# ─────────────────────────────────────────────────────────────────────────────

extractions:
  # ── THE CLASSIC PROBLEM TABLE. Kept, but it is NOT what the reports read.
  # Verified live 2026-09-22: 0 rows, while the Problem Control UI showed 19
  # records and Quality_v_Problem_2 held 22. Vox records on Plex's UX screen,
  # which writes Problem_2 (below). Left extracted so that anything ever
  # recorded on the classic screen still lands somewhere — and so the
  # contrast between the two raw tables stays visible instead of becoming
  # folklore.
  - plex_view: Quality_v_Problem
    bq_table: raw_Quality_v_Problem
    filter: ""
    date_col: ""

  # ── Added 2026-09-22 — THE TABLE VOX ACTUALLY WRITES TO.
  #
  # quality_nonconformance_report, quality_turnaround_time_report,
  # quality_cost_by_category_report and quality_disposition_cost_report all
  # read this now. Every one of them had been returning 0 rows since the day
  # it was built, while the jobs exited 0 — the zero-row guard preserves the
  # empty table and the run reports success, so nothing ever said "wrong
  # table". 161 columns; the ones that change the design are Problem_Form_Key
  # (how Quality classifies: Material Destruction, 8D, Risk Assessment...),
  # Job_Key/Job_Op_Key ON the record, Recorded_Date beside Problem_Date, and
  # Champion / Department_No / Building_Key / Problem_Due_Date / Recurrence /
  # Quantity_Scrapped.
  - plex_view: Quality_v_Problem_2
    bq_table: raw_Quality_v_Problem_2
    filter: ""
    date_col: ""

  # The form lookup for Problem_Form_Key — 26 rows, and the reason "Material
  # Destruction" is findable at all. Note it carries both the new forms and
  # their "(Classic)" twins; the Name column is what the UI shows.
  - plex_view: Quality_v_Problem_Form
    bq_table: raw_Quality_v_Problem_Form
    filter: ""
    date_col: ""

  # ── Added 2026-08-18 for quality_deviation_report (see bq_view list below) ──
  # The Deviation record itself: type/status keys, pieces affected, reason,
  # approval dates. Job/Problem/Part/Workcenter correlation comes from the
  # 4 junction tables below, not from columns on this view directly.
  - plex_view: Quality_v_Deviation
    bq_table: raw_Quality_v_Deviation
    filter: ""
    date_col: ""

  # Deviation ↔ Job junction — the actual fix for the NC-to-job gap.
  - plex_view: Quality_v_Deviation_Job
    bq_table: raw_Quality_v_Deviation_Job
    filter: ""
    date_col: ""

  # Deviation ↔ Problem (NC) junction.
  - plex_view: Quality_v_Deviation_Problem
    bq_table: raw_Quality_v_Deviation_Problem
    filter: ""
    date_col: ""

  # Deviation ↔ Part junction.
  - plex_view: Quality_v_Deviation_Part
    bq_table: raw_Quality_v_Deviation_Part
    filter: ""
    date_col: ""

  # Deviation ↔ Workcenter junction.
  - plex_view: Quality_v_Deviation_Workcenter
    bq_table: raw_Quality_v_Deviation_Workcenter
    filter: ""
    date_col: ""

  # Deviation_Type_Key / Deviation_Status_Key are real FKs (unlike
  # Quality_v_Problem's inline text columns) — both lookups needed.
  - plex_view: Quality_v_Deviation_Type
    bq_table: raw_Quality_v_Deviation_Type
    filter: ""
    date_col: ""

  - plex_view: Quality_v_Deviation_Status
    bq_table: raw_Quality_v_Deviation_Status
    filter: ""
    date_col: ""

  # ── Added 2026-09-09 — DISPOSITION VALUE LISTS, to answer "where are
  # destructions logged?"
  #
  # Jennilyn's open question from the 2026-09-09 call: "destructions is like a
  # disposition, but I'm not sure where we would find that... I actually need
  # to ask because I'm not sure where they note that they destroyed
  # something."
  #
  # Quality_v_Problem already carries Initial_Disposition and
  # Final_Disposition as INLINE TEXT (no _Key suffix — the confirmed
  # convention in this repo for a text value rather than a lookup key), plus a
  # note field for each, and quality_nonconformance_report already surfaces
  # final_disposition. What was missing is the list of values Vox can actually
  # choose, which is what these two lookups hold — one row per permitted
  # string. Extracting them enumerates the options instead of guessing at
  # them, and tells us directly whether "destroyed"/"scrap" is one.
  #
  # Quality_v_Disposition_Type is a SEPARATE, KEYED concept (Disposition_Type_Key
  # + Disposition_Type) that does not join to Quality_v_Problem's text
  # columns. Extracted alongside them because it is the other place a
  # destruction concept could plausibly live, and one cheap lookup now avoids
  # a second round trip if the text lists come back without it.
  - plex_view: Quality_v_Final_Disposition
    bq_table: raw_Quality_v_Final_Disposition
    filter: ""
    date_col: ""

  - plex_view: Quality_v_Initial_Disposition
    bq_table: raw_Quality_v_Initial_Disposition
    filter: ""
    date_col: ""

  - plex_view: Quality_v_Disposition_Type
    bq_table: raw_Quality_v_Disposition_Type
    filter: ""
    date_col: ""

# Part_v_Part is intentionally NOT extracted here — reuse raw_Part_v_Part
# from the sales_orders pipeline (same shared-table rule as work_orders.yaml).
#
# Part_v_Job and Part_v_Workcenter are also intentionally NOT extracted here
# — quality_deviation_view.sql reuses raw_Part_v_Job / raw_Part_v_Workcenter,
# both owned by the work_orders pipeline, same shared-table rule.

# bq_view is a LIST — quality_turnaround_time_report added 2026-08-14, best-
# criteria NetSuite parity for "Turn Around Time Report - Last Month" /
# "Turn Around Time Report - Rolling" (mapping/netsuite-report-mapping.md
# #69/#70). Same raw_Quality_v_Problem extraction as
# quality_nonconformance_report.
bq_view:
  - name: quality_nonconformance_report
    display_name: "Quality Nonconformance"
    sql_file: gs://voxdatalake-report-configs/sql/quality_nonconformance_view.sql
  - name: quality_turnaround_time_report
    display_name: "Turn Around Time Report"
    sql_file: gs://voxdatalake-report-configs/sql/quality_turnaround_time_view.sql
  - name: quality_deviation_report
    display_name: "Quality Deviations"
    sql_file: gs://voxdatalake-report-configs/sql/quality_deviation_view.sql
  # Added 2026-09-01 — Vox Nutrition Scorecard migration
  # (score-card-reference/VOX_SCORECARD_PLEX_MIGRATION_MAP.md). Thin alias
  # over quality_nonconformance_report above — must stay listed after it.
  - name: quality_cost_by_category_report
    display_name: "Vox Scorecard | NC Cost by Category"
    sql_file: gs://voxdatalake-report-configs/sql/quality_cost_by_category_view.sql

  # ── Added 2026-09-09 — the Destruction $ / Rework $ grain.
  # Grouped by what was DONE with the material (final disposition) rather than
  # by problem category, because that is where destructions actually live:
  # Vox's disposition list has no "Destroy" value, it has `Scrap`. Read the
  # SQL header before touching this — it documents that finding, the fact that
  # "Rework" also exists as a container status (which is the source Jennilyn
  # named for the Rework tile), and why VoxScorecardsLive.Product_Cost is NOT
  # usable as a cost source.
  # Thin alias over quality_nonconformance_report — must stay listed after it.
  - name: quality_disposition_cost_report
    display_name: "Vox Scorecard | NC Cost by Disposition (Destruction/Rework)"
    sql_file: gs://voxdatalake-report-configs/sql/quality_disposition_cost_view.sql
