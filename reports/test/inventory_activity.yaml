report_name: inventory_activity_test
category: Supply Chain
description: "Inventory Activity Detail Usage Per Month — TEST environment (vox.odbc.plex.com → PlexTest dataset)"

# Same extraction list as reports/inventory_activity.yaml — see that file for
# the genealogy-vs-activity caveat and confirmation notes.

# Change probe — see main.py and docs/PROBE_BUILD_PLAN.md. Columns per
# extraction were picked by scripts/generate_probe_columns.py.
probe_mode: auto

extractions:
  - plex_view: Part_v_Cell_Production
    bq_table: raw_Part_v_Cell_Production
    filter: ""
    date_col: Production_Date
    probe: [Production_Date, Cell_Production_Key, sum:Quantity]

  - plex_view: Part_v_Cell_Depletion
    bq_table: raw_Part_v_Cell_Depletion
    filter: ""
    date_col: Production_Date
    probe: [Production_Date, Cell_Depletion_Key, sum:Quantity]

bq_view:
  - name: inventory_activity_report
    display_name: "Inventory Activity Detail Usage Per Month"
    sql_file: gs://voxdatalake-report-configs/sql/inventory_activity_view.sql
  # Added 2026-09-01 — see reports/inventory_activity.yaml for the full story.
  - name: inventory_avg_daily_usage_report
    display_name: "Vox Scorecard | Avg Daily Usage"
    sql_file: gs://voxdatalake-report-configs/sql/inventory_avg_daily_usage_view.sql
