report_name: label_design_test
category: Sales
description: "Label Design queue — TEST environment (vox.test.odbc.plex.com -> PlexTest dataset)"

# Same extraction list as reports/label_design.yaml.

extractions:
  - plex_view: Sales_v_PO
    bq_table: raw_Sales_v_PO
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Line
    bq_table: raw_Sales_v_PO_Line
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Release
    bq_table: raw_Sales_v_Release
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Status
    bq_table: raw_Sales_v_PO_Status
    filter: ""
    date_col: ""

  # New — not extracted anywhere else in the repo before 2026-09-11.
  - plex_view: Sales_v_Release_Status
    bq_table: raw_Sales_v_Release_Status
    filter: ""
    date_col: ""

  # The Job Note. This was the hard part of the original stored procedure to
  # locate, so it is extracted whole rather than filtered at source — the
  # Note_Type filter lives in the SQL where it can be seen and changed.
  - plex_view: Sales_v_PO_Line_Note
    bq_table: raw_Sales_v_PO_Line_Note
    filter: ""
    date_col: ""

  - plex_view: Part_v_Customer_Part
    bq_table: raw_Part_v_Customer_Part
    filter: ""
    date_col: ""

  - plex_view: Common_v_Customer
    bq_table: raw_Common_v_Customer
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Order_Salesperson
    bq_table: raw_Sales_v_Order_Salesperson
    filter: ""
    date_col: ""

  - plex_view: Plexus_Control_v_Plexus_User
    bq_table: raw_Plexus_Control_v_Plexus_User
    filter: ""
    date_col: ""

bq_view:
  - name: label_design_report
    display_name: "Label Design Queue"
    sql_file: gs://voxdatalake-report-configs/sql/label_design_view.sql
