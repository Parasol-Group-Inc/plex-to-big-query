  - plex_view: Part_v_Lot_Format
    bq_table: raw_Part_v_Lot_Format
    filter: ""
    date_col: ""
    probe: [Update_Date, Lot_Format_Key]

bq_view:
  - name: part_lot_attribute_specs_report
    display_name: "Part Lot Attribute Specs"
    sql_file: gs://voxdatalake-report-configs/sql/part_lot_attribute_specs_view.sql
  - name: part_lot_inheritance_report
    display_name: "Part Lot Inheritance"
    sql_file: gs://voxdatalake-report-configs/sql/part_lot_inheritance_view.sql
