report_name: part_on_hand_inventory_test
category: Supply Chain
description: "Part on-hand inventory (Available Inventory) — TEST environment (vox.test.odbc.plex.com → PlexTest dataset)"

# Same extraction list as reports/part_on_hand_inventory.yaml.

extractions:
  - plex_view: Part_v_Container
    bq_table: raw_Part_v_Container
    filter: ""
    date_col: ""

  - plex_view: Part_v_Container_Status
    bq_table: raw_Part_v_Container_Status
    filter: ""
    date_col: ""

# raw_Part_v_Part is owned by the sales_orders pipeline (runs 7:10 PM Mountain for test).
# raw_Part_v_Part_Product_Type (added 2026-08-19) is the same story.

bq_view:
  - name: part_on_hand_inventory_report
    display_name: "Part On-Hand Inventory"
    sql_file: gs://voxdatalake-report-configs/sql/part_on_hand_inventory_view.sql
  - name: inventory_risk_analysis_report
    display_name: "Inventory Risk Analysis"
    sql_file: gs://voxdatalake-report-configs/sql/inventory_risk_analysis_view.sql
