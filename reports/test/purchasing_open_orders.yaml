report_name: purchasing_open_orders_test
category: Supply Chain
description: "Vox | Open Purchase Orders — TEST environment (vox.odbc.plex.com → PlexTest dataset)"

# Same extraction list as reports/purchasing_open_orders.yaml — see that file
# for schema confirmation notes and deployment status (not yet deployed).

# Change probe — see main.py and docs/PROBE_BUILD_PLAN.md. Columns per
# extraction were picked by scripts/generate_probe_columns.py.
probe_mode: auto

extractions:
  - plex_view: Purchasing_v_PO
    bq_table: raw_Purchasing_v_PO
    filter: ""
    date_col: ""
    probe: [Update_Date, PO_Key]

  - plex_view: Purchasing_v_PO_Status
    bq_table: raw_Purchasing_v_PO_Status
    filter: ""
    date_col: ""
    probe: [PO_Status_Key]

  - plex_view: Purchasing_v_PO_Type
    bq_table: raw_Purchasing_v_PO_Type
    filter: ""
    date_col: ""
    probe: [Add_Date, PO_Type_Key]

  - plex_view: Purchasing_v_Release
    bq_table: raw_Purchasing_v_Release
    filter: ""
    date_col: ""
    probe: [Updated_Date]

  - plex_view: Purchasing_v_Line_Item
    bq_table: raw_Purchasing_v_Line_Item
    filter: ""
    date_col: ""
    probe: [Updated_Date, Line_Item_Key]

  - plex_view: Common_v_Supplier
    bq_table: raw_Common_v_Supplier
    filter: ""
    date_col: ""
    probe: [Updated_Date]

bq_view:
  - name: purchasing_open_orders_report
    display_name: "Vox | Open Purchase Orders"
    sql_file: gs://voxdatalake-report-configs/sql/purchasing_open_orders_view.sql
  - name: purchasing_po_pending_approval_report
    display_name: "Purchase Orders to Approve: Results"
    sql_file: gs://voxdatalake-report-configs/sql/purchasing_po_pending_approval_view.sql
