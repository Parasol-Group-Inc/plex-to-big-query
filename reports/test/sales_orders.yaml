# See reports/sales_orders.yaml for why bq_view is a list — the same
# deploy-ordering caveat (main.py's bq_view-list support must ship before
# this reaches the test Cloud Run job) applies here too.
bq_view:
  - name: sales_orders_report
    display_name: "Sales Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_view.sql
  - name: sales_orders_open_report
    display_name: "Vox | Open Sales Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_open_view.sql
  - name: sales_orders_pending_approval_report
    display_name: "Pending Approval Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_approval_view.sql
  - name: sales_orders_pending_approval_by_rep_report
    display_name: "Orders Pending Approval by Sales Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_approval_by_rep_view.sql
  - name: sales_orders_pending_accounting_approval_report
    display_name: "Orders Pending Approval by Accounting"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_accounting_approval_view.sql
  - name: sales_orders_aging_report
    display_name: "Report for orders past 14 days old"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_aging_view.sql
  - name: sales_orders_over_10k_report
