report_name: sales_orders_test
category: Sales
description: "16-field sales orders report — TEST environment (vox.odbc.plex.com → PlexTest dataset)"

# Same extraction list as reports/sales_orders.yaml.
# BQ_DATASET=PlexTest is injected by the plex-etl-sales-orders-test Cloud Run job,
# so all raw tables land in PlexTest and the BQ view is created there too.

extractions:
  - plex_view: Sales_v_PO
    bq_table: raw_Sales_v_PO
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Line
    bq_table: raw_Sales_v_PO_Line
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Change
    bq_table: raw_Sales_v_PO_Change
    filter: ""
    date_col: Change_Date

  - plex_view: Sales_v_PO_Status
    bq_table: raw_Sales_v_PO_Status
    filter: ""
    date_col: ""

  - plex_view: Sales_v_PO_Type
    bq_table: raw_Sales_v_PO_Type
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Order_Salesperson
    bq_table: raw_Sales_v_Order_Salesperson
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Release
    bq_table: raw_Sales_v_Release
    filter: ""
    date_col: ""

  # Added 2026-08-21 for sales_order_allocation_report — see reports/sales_orders.yaml
  - plex_view: Sales_v_Release_Job
    bq_table: raw_Sales_v_Release_Job
    filter: ""
    date_col: ""

  # Added 2026-09-01, EXPLORATORY — see reports/sales_orders.yaml for the
  # full story (Shipping module, per the 2026-09-01 Emilio/Jennilyn meeting).
  - plex_view: Sales_v_Shipper
    bq_table: raw_Sales_v_Shipper
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Shipper_Line
    bq_table: raw_Sales_v_Shipper_Line
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Shipper_Status
    bq_table: raw_Sales_v_Shipper_Status
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Shipper_Container
    bq_table: raw_Sales_v_Shipper_Container
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Shipper_AR_Invoice
    bq_table: raw_Sales_v_Shipper_AR_Invoice
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Shipper_Line_Release
    bq_table: raw_Sales_v_Shipper_Line_Release
    filter: ""
    date_col: ""

  - plex_view: Sales_v_Release_Allocation
    bq_table: raw_Sales_v_Release_Allocation
    filter: ""
    date_col: ""

  # Added 2026-09-04 — the SALES ORDER LINE price, per the Sep-4 meeting.
  # Jennilyn: "No, it'll always have a price in there. So it needs to be the
  # line item price." Keyed on PO_Line_Key, so it is the price actually agreed
  # on that order line — NOT Part_v_Customer_Part_Price, which is a generic
  # customer/part list and had no matching row for any of the 7 real Pending
  # Fulfillment orders, leaving WIP and Sales MTD reading $0 across 35,201
  # real units.
  - plex_view: Sales_v_Price
    bq_table: raw_Sales_v_Price
    filter: ""
    date_col: ""

  - plex_view: Common_v_Customer
    bq_table: raw_Common_v_Customer
    filter: ""
    date_col: ""

  - plex_view: Part_v_Customer_Part_Price
    bq_table: raw_Part_v_Customer_Part_Price
    filter: ""
    date_col: ""

  - plex_view: Part_v_Part
    bq_table: raw_Part_v_Part
    filter: ""
    date_col: ""

  - plex_view: Part_v_Part_Product_Type
    bq_table: raw_Part_v_Part_Product_Type
    filter: ""
    date_col: ""

  - plex_view: Part_v_Part_Product_Group
    bq_table: raw_Part_v_Part_Product_Group
    filter: ""
    date_col: ""

  - plex_view: Part_v_Part_Group
    bq_table: raw_Part_v_Part_Group
    filter: ""
    date_col: ""

  - plex_view: Plexus_Control_v_Plexus_User
    bq_table: raw_Plexus_Control_v_Plexus_User
    filter: ""
    date_col: ""

  # Added 2026-09-22 — the Inside Sales roster behind sales_reps_report.
  # See reports/sales_orders.yaml for why the goals dropdown needed it.
  - plex_view: Plexus_Control_v_Role
    bq_table: raw_Plexus_Control_v_Role
    filter: ""
    date_col: ""

  - plex_view: Plexus_Control_v_User_Role
    bq_table: raw_Plexus_Control_v_User_Role
    filter: ""
    date_col: ""

  # Added 2026-09-09 — BOM, for BOM-exploded component demand. See
  # reports/sales_orders.yaml for why this is needed at all (Plex's own
  # "Order Reqd" demand column) and why Flat_BOM is the one to use.
  - plex_view: Part_v_Flat_BOM
    bq_table: raw_Part_v_Flat_BOM
    filter: ""
    date_col: ""

  - plex_view: Part_v_BOM
    bq_table: raw_Part_v_BOM
    filter: ""
    date_col: ""

# See reports/sales_orders.yaml for why bq_view is a list — the same
# deploy-ordering caveat (main.py's bq_view-list support must ship before
# this reaches the test Cloud Run job) applies here too.
bq_view:
  - name: sales_orders_report
    display_name: "Sales Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_view.sql
  - name: sales_orders_open_report
    display_name: "Vox | Open Sales Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_open_view.sql
  - name: sales_orders_pending_approval_report
    display_name: "Pending Approval Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_approval_view.sql
  - name: sales_orders_pending_approval_by_rep_report
    display_name: "Orders Pending Approval by Sales Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_approval_by_rep_view.sql
  - name: sales_orders_pending_accounting_approval_report
    display_name: "Orders Pending Approval by Accounting"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_pending_accounting_approval_view.sql
  - name: sales_orders_aging_report
    display_name: "Report for orders past 14 days old"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_aging_view.sql
  - name: sales_orders_over_10k_report
    display_name: "Orders over $10k"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_over_10k_view.sql
  - name: sales_orders_over_10k_bottles_report
    display_name: "Orders over 10k bottles"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_over_10k_bottles_view.sql
  - name: sales_customers_by_rep_report
    display_name: "Customer List by Sales Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_customers_by_rep_view.sql
  - name: sales_revenue_by_rep_report
    display_name: "Revenue per Sales Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_revenue_by_rep_view.sql
  - name: sales_orders_rush_open_report
    display_name: "RUSH Open Sales Orders"
    sql_file: gs://voxdatalake-report-configs/sql/sales_orders_rush_open_view.sql
  - name: sales_order_allocation_report
    display_name: "Vox | Allocation Report"
    sql_file: gs://voxdatalake-report-configs/sql/sales_order_allocation_view.sql
  # ── 2026-09-01 Emilio/Jennilyn meeting corrections — see reports/sales_orders.yaml ──
  - name: shipping_revenue_report
    display_name: "Vox Scorecard | Shipping Revenue (detail)"
    sql_file: gs://voxdatalake-report-configs/sql/shipping_revenue_report.sql
  - name: sales_revenue_summary_report
    display_name: "Vox Scorecard | Revenue Summary (MTD/YTD)"
    sql_file: gs://voxdatalake-report-configs/sql/sales_revenue_summary_view.sql
  - name: sales_order_value_by_status_report
    display_name: "Vox Scorecard | WIP Order Value"
    sql_file: gs://voxdatalake-report-configs/sql/sales_order_value_by_status_view.sql
  - name: shipping_pending_revenue_report
    display_name: "Vox Scorecard | Total in Shipping (Pending Revenue)"
    sql_file: gs://voxdatalake-report-configs/sql/shipping_pending_revenue_view.sql
  - name: shipping_daily_report
    display_name: "Vox Scorecard | Shipping Daily (Packages/Orders/Revenue)"
    sql_file: gs://voxdatalake-report-configs/sql/shipping_daily_report_view.sql
  # ── Added 2026-09-09 — mirrors reports/sales_orders.yaml. MUST stay listed
  # before inventory_out_of_stock_report, which SELECTs from it.
  - name: inventory_available_to_sell_report
    display_name: "Inventory | Available to Sell (On-Hand less Demand)"
    sql_file: gs://voxdatalake-report-configs/sql/inventory_available_to_sell_view.sql
  - name: inventory_out_of_stock_report
    display_name: "Vox Scorecard | Out of Stock (33-parts)"
    sql_file: gs://voxdatalake-report-configs/sql/inventory_out_of_stock_view.sql

  # ── Added 2026-09-04 — mirrors reports/sales_orders.yaml. See that file
  # for the ordering constraints (rollup views must follow their source).
  - name: sales_mtd_by_status_change_report
    display_name: "Vox Scorecard | Sales MTD (by status change, detail)"
    sql_file: gs://voxdatalake-report-configs/sql/sales_mtd_by_status_change_view.sql
  - name: sales_mtd_summary_report
    display_name: "Vox Scorecard | Sales MTD/YTD by Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_mtd_summary_view.sql
  - name: sales_revenue_run_rate_report
    display_name: "Vox Scorecard | Revenue Run Rate & % Into Month"
    sql_file: gs://voxdatalake-report-configs/sql/sales_revenue_run_rate_view.sql
  - name: pipeline_plex_value_report
    display_name: "Vox Scorecard | Pipeline Value (Plex half only)"
    sql_file: gs://voxdatalake-report-configs/sql/pipeline_plex_value_view.sql

  # ── Added 2026-09-04 — goal vs actual. These are the FIRST views in this
  # pipeline that read a maintained table (`scorecard_goals`) rather than
  # Plex data. That table is fed from a Google Sheet by an Apps Script and is
  # NOT created by this ETL — if it's missing, these two views fail to create.
  # Both must stay after sales_revenue_summary_report / sales_mtd_summary_report.
  # ── The ONE goals source, renamed from v2_scorecard_goals_resolved
  # 2026-09-22 when the duplicate "v2_" report views were retired. App-first
  # with the legacy `scorecard_goals` table as a fallback until
  # importLegacyGoals() has run — see the SQL header for how to finish that.
  #
  # ORDER MATTERS: it must be created BEFORE the *_vs_goal_report views that
  # read it. Listed in both sales_orders and work_orders because goal views
  # live in both pipelines; the SQL is identical, so whichever runs second
  # replaces an identical view.
  - name: scorecard_goals_resolved
    display_name: "Goals | Resolved (one goal per metric/month/scope)"
    sql_file: gs://voxdatalake-report-configs/sql/scorecard_goals_resolved_view.sql
  - name: revenue_vs_goal_report
    display_name: "Vox Scorecard | Revenue vs Goal"
    sql_file: gs://voxdatalake-report-configs/sql/revenue_vs_goal_view.sql
  - name: sales_vs_goal_report
    display_name: "Vox Scorecard | Sales vs Goal by Rep"
    sql_file: gs://voxdatalake-report-configs/sql/sales_vs_goal_view.sql

  # ── Added 2026-09-22 — the roster behind the manual-data app's sales-goal
  # dropdown. Reads the Plex `Inside Sales` role rather than "reps who sold
  # something this month", so a rep can be given a goal before their first
  # sale. Matched on the role NAME, not its key.
  - name: sales_reps_report
    display_name: "Sales Reps (Inside Sales roster)"
    sql_file: gs://voxdatalake-report-configs/sql/sales_reps_view.sql
