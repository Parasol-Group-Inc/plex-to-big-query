report_name: sales_quotes_test
category: Sales
description: "Vox | Open Quotes — TEST environment (vox.test.odbc.plex.com → PlexTest dataset)"

# Change probe — see main.py and docs/PROBE_BUILD_PLAN.md. Columns per
# extraction were picked by scripts/generate_probe_columns.py.
probe_mode: auto

extractions:
  - plex_view: Sales_v_Quote
    bq_table: raw_Sales_v_Quote
    filter: ""
    date_col: ""
    probe: [Update_Date, Quote_Key]

  - plex_view: Sales_v_Quote_Status
    bq_table: raw_Sales_v_Quote_Status
    filter: ""
    date_col: ""
    probe: [Quote_Status_Key]

bq_view:
  name: sales_quotes_open_report
  display_name: "Open Quotes"
  sql_file: gs://voxdatalake-report-configs/sql/sales_quotes_open_view.sql
