report_name: work_orders_test
category: Production
description: "Work orders by workcenter — TEST environment (vox.test.odbc.plex.com → PlexTest dataset)"

# Same extraction list as reports/work_orders.yaml.
# BQ_DATASET=PlexTest is injected by the plex-etl-work-orders-test Cloud Run job,
# so all raw tables land in PlexTest and the BQ view is created there too.

extractions:
  - plex_view: Part_v_Job
    bq_table: raw_Part_v_Job
    filter: ""
    date_col: ""

  - plex_view: Part_v_Job_Op
    bq_table: raw_Part_v_Job_Op
    filter: ""
    date_col: ""

  - plex_view: Part_v_Workcenter
    bq_table: raw_Part_v_Workcenter
    filter: ""
    date_col: ""

  - plex_view: Part_v_Workcenter_Log
    bq_table: raw_Part_v_Workcenter_Log
    filter: ""
    date_col: ""

  # ── Added 2026-08-11 for mfg_job_schedule_report (see bq_view list below) ──
  - plex_view: Part_v_Job_Status
    bq_table: raw_Part_v_Job_Status
    filter: ""
    date_col: ""

  - plex_view: Personnel_v_Employee
    bq_table: raw_Personnel_v_Employee
    filter: ""
    date_col: ""

  - plex_view: Part_v_Lot
    bq_table: raw_Part_v_Lot
    filter: ""
    date_col: ""

  - plex_view: Part_v_Lot_Shelf_Life
    bq_table: raw_Part_v_Lot_Shelf_Life
    filter: ""
    date_col: ""

  - plex_view: Quality_v_Checksheet
    bq_table: raw_Quality_v_Checksheet
    filter: ""
    date_col: ""

  - plex_view: Quality_v_Checksheet_Status
    bq_table: raw_Quality_v_Checksheet_Status
    filter: ""
    date_col: ""

  - plex_view: Maintenance_v_Equipment
    bq_table: raw_Maintenance_v_Equipment
    filter: ""
    date_col: ""

  - plex_view: Common_v_Building
    bq_table: raw_Common_v_Building
    filter: ""
    date_col: ""

  # ── Added 2026-08-11 for the FG Testing Pending tab's Stock/Custom lead ──
  - plex_view: Part_v_Job_Type
    bq_table: raw_Part_v_Job_Type
    filter: ""
    date_col: ""

  - plex_view: Part_v_Job_Distribution
    bq_table: raw_Part_v_Job_Distribution
    filter: ""
    date_col: ""

  # Added 2026-08-21 for the 4 Daily Reports — see reports/work_orders.yaml
  - plex_view: Part_v_Cell_Production
    bq_table: raw_Part_v_Cell_Production
    filter: ""
    date_col: Production_Date

  # Corrected same day — see reports/work_orders.yaml for the full story.
  - plex_view: Part_v_Production
    bq_table: raw_Part_v_Production
    filter: ""
    date_col: Record_Date

# NOTE: Part_v_Part is intentionally NOT extracted here.
# raw_Part_v_Part is owned by the sales_orders pipeline (runs 7:10 PM Mountain for test).
# raw_Part_v_Part_Product_Type (added 2026-08-19) is the same story.
# work_orders_view.sql references it as a shared table in the same dataset.

bq_view:
  - name: work_orders_report
    display_name: "Work Orders"
    sql_file: gs://voxdatalake-report-configs/sql/work_orders_view.sql
  - name: mfg_job_schedule_report
    display_name: "MFG Job Schedule"
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_view.sql
  - name: labeling_open_work_orders_report
    display_name: "Labeling | Open WO: Results"
    sql_file: gs://voxdatalake-report-configs/sql/labeling_open_work_orders_view.sql
  - name: printing_open_work_orders_report
    display_name: "Printing Open Work Orders"
    sql_file: gs://voxdatalake-report-configs/sql/printing_open_work_orders_view.sql
  - name: encap_daily_report
    display_name: "Encap Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/encap_daily_report_view.sql
  - name: blending_daily_report
    display_name: "Blending Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/blending_daily_report_view.sql
  - name: labeling_daily_report
    display_name: "Labeling Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/labeling_daily_report_view.sql
  - name: packaging_daily_report
    display_name: "Packaging Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/packaging_daily_report_view.sql
  - name: bottling_job_schedule_report
    display_name: "Bottling Job Schedule"
    sql_file: gs://voxdatalake-report-configs/sql/bottling_job_schedule_view.sql
