report_name: work_orders
description: "Work orders by workcenter — Vox Nutrition production report (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO EDIT THIS REPORT (no deployment required):
#
#   Add a view    → add a new entry to extractions[], save this file to GCS
#   Change filter → update the filter field on the relevant entry, save to GCS
#   Change SQL    → edit reports/sql/work_orders_view.sql and save to GCS
#
# After saving, the next Cloud Run job execution picks up the changes automatically.
# Manual trigger: gcloud run jobs execute plex-etl-work-orders --region us-central1
# ─────────────────────────────────────────────────────────────────────────────

# NOTE: In Plex, "Work Orders" (Part_v_Work_Order) and "Jobs" (Part_v_Job) are
# separate entities — there is no direct FK between them in the ODBC views.
# Jobs are the shop-floor execution records that carry actual production data
# (qty per operation, times, workcenter assignments). This report uses Jobs.

extractions:
  # Job header — one row per production job (Job_No, part, qty, status, dates)
  - plex_view: Part_v_Job
    bq_table: raw_Part_v_Job
    filter: ""
    date_col: ""

  # Job operations — one row per workcenter step per job (qty, setup/run time, dates)
  - plex_view: Part_v_Job_Op
    bq_table: raw_Part_v_Job_Op
    filter: ""
    date_col: ""

  # Workcenter master — Name and Workcenter_Type are inline (no extra join needed)
  - plex_view: Part_v_Workcenter
    bq_table: raw_Part_v_Workcenter
    filter: ""
    date_col: ""

  # Workcenter log — actual hours logged by operators per job operation
  - plex_view: Part_v_Workcenter_Log
    bq_table: raw_Part_v_Workcenter_Log
    filter: ""
    date_col: ""

# NOTE: Part_v_Part is intentionally NOT extracted here.
# raw_Part_v_Part is owned by the sales_orders pipeline (runs at 2 AM).
# work_orders_view.sql references it as a shared table in the same dataset.
# Do not add Part_v_Part here — two WRITE_TRUNCATEs on the same table
# from different pipelines risk silently emptying it on a 0-row Plex response.

# BigQuery reporting view that JOINs the raw tables above into the work orders report.
# The SQL file is loaded from GCS at runtime so it can be edited independently
# without touching this YAML.  {gcp_project} and {dataset} in the SQL are
# replaced at runtime with the GCP_PROJECT and BQ_DATASET env var values.
bq_view:
  name: work_orders_report
  sql_file: gs://voxdatalake-report-configs/sql/work_orders_view.sql
