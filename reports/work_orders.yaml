report_name: work_orders
category: Production
description: "Work orders by workcenter — Vox Nutrition production report (PlexProd dataset)"

# `category` and each bq_view's `display_name` below map back to the
# company Reports List (reports-list/production.md) — "Work Orders" itself
# has no Reports List entry (it's this pipeline's original, internal
# deliverable), while MFG Job Schedule and Labeling | Open WO: Results are
# both named, tracked entries there. All three are peer reports produced by
# this one shared extraction — none of them is the "general" one the others
# hang off of. See docs/OPERATIONS.md if this ever needs its own dedicated
# Cloud Run job instead of riding along here.

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO EDIT THIS REPORT (no deployment required):
#
#   Add a view    → add a new entry to extractions[], save this file to GCS
#   Change filter → update the filter field on the relevant entry, save to GCS
#   Change SQL    → edit reports/sql/work_orders_view.sql and save to GCS
#
# After saving, the next Cloud Run job execution picks up the changes automatically.
# Manual trigger: gcloud run jobs execute plex-etl-work-orders --region us-central1
# ─────────────────────────────────────────────────────────────────────────────

# NOTE: In Plex, "Work Orders" (Part_v_Work_Order) and "Jobs" (Part_v_Job) are
# separate entities — there is no direct FK between them in the ODBC views.
# Jobs are the shop-floor execution records that carry actual production data
# (qty per operation, times, workcenter assignments). This report uses Jobs.

extractions:
  # Job header — one row per production job (Job_No, part, qty, status, dates)
  # Also read (not extracted) by the sales_orders pipeline's
  # sales_order_allocation_report as of 2026-08-21 — do not remove.
  - plex_view: Part_v_Job
    bq_table: raw_Part_v_Job
    filter: ""
    date_col: ""

  # Job operations — one row per workcenter step per job (qty, setup/run time, dates)
  - plex_view: Part_v_Job_Op
    bq_table: raw_Part_v_Job_Op
    filter: ""
    date_col: ""

  # Workcenter master — Name and Workcenter_Type are inline (no extra join needed)
  - plex_view: Part_v_Workcenter
    bq_table: raw_Part_v_Workcenter
    filter: ""
    date_col: ""

  # Workcenter log — actual hours logged by operators per job operation
  - plex_view: Part_v_Workcenter_Log
    bq_table: raw_Part_v_Workcenter_Log
    filter: ""
    date_col: ""

  # ── Added 2026-08-11 for mfg_job_schedule_report (see bq_view list below) ──

  # Job status lookup — resolves Job_Status_Key to text + Completed/Cancelled flags
  # Also read (not extracted) by the sales_orders pipeline's
  # sales_order_allocation_report as of 2026-08-21 — do not remove.
  - plex_view: Part_v_Job_Status
    bq_table: raw_Part_v_Job_Status
    filter: ""
    date_col: ""

  # Employee master — resolves Job_Op.Started_By/Completed_By to an operator name
  - plex_view: Personnel_v_Employee
    bq_table: raw_Personnel_v_Employee
    filter: ""
    date_col: ""

  # Lot master — Job.Lot_Key joins here for lot number + manufactured date
  - plex_view: Part_v_Lot
    bq_table: raw_Part_v_Lot
    filter: ""
    date_col: ""

  # Lot shelf life — raw value only, see mfg_job_schedule_view.sql header for why
  # this isn't converted into an expiration date
  - plex_view: Part_v_Lot_Shelf_Life
    bq_table: raw_Part_v_Lot_Shelf_Life
    filter: ""
    date_col: ""

  # QC inspection records — Job_Op_Key joins directly, closest analog to the
  # manual tracker's "Raw Material in Testing" / "Raws Released" columns
  - plex_view: Quality_v_Checksheet
    bq_table: raw_Quality_v_Checksheet
    filter: ""
    date_col: ""

  # Checksheet status lookup — text label + Approved/Rejected/Expired flags
  - plex_view: Quality_v_Checksheet_Status
    bq_table: raw_Quality_v_Checksheet_Status
    filter: ""
    date_col: ""

  # Equipment/asset master — Workcenter_Key resolves an operation to its asset ID
  - plex_view: Maintenance_v_Equipment
    bq_table: raw_Maintenance_v_Equipment
    filter: ""
    date_col: ""

  # Building master — Job.Building_Key resolves to a room/building name
  - plex_view: Common_v_Building
    bq_table: raw_Common_v_Building
    filter: ""
    date_col: ""

  # ── Added 2026-08-11 for the FG Testing Pending tab's Stock/Custom lead ──

  # Job type lookup — resolves Job.Job_Type_Key to text (Stock/Service/
  # Pre-Production/Rework). Plausible Stock-vs-Custom signal, unconfirmed
  # against real data — see spreadsheets/mfg_job_schedule_fg_testing_pending.md
  - plex_view: Part_v_Job_Type
    bq_table: raw_Part_v_Job_Type
    filter: ""
    date_col: ""

  # Job distribution — a job with a distribution row tied to a Release_Key
  # is fulfilling a specific customer order; no row = stock replenishment.
  # Second, independent Stock-vs-Custom lead, also unconfirmed against data.
  - plex_view: Part_v_Job_Distribution
    bq_table: raw_Part_v_Job_Distribution
    filter: ""
    date_col: ""

  # ── Added 2026-08-21 for the 4 Daily Reports (see bq_view list below) ──
  # Initially built on Part_v_Cell_Production, corrected same day: a live
  # screenshot of Plex's own "Job Production" report (columns Job No/Part
  # No/Op No/Workcenter/Employee/Record Date/Shift/Quantity) matches
  # Part_v_Production field-for-field (Record_By, Report_Shift, Record_Date,
  # Workcenter_Key, Job_Op_Key, Quantity, Rejected) — Cell_Production has no
  # Employee/Shift/Rejected columns at all. This is the real source for the
  # 4 Daily Reports — gives a genuine `Rejected` scrap flag and
  # `Record_By`/`Report_Shift`, resolving 2 of the 3 gaps flagged as "no
  # Plex analog" that morning.
  #
  # Removed 2026-08-23: this pipeline briefly also extracted
  # Part_v_Cell_Production (raw_Part_v_Cell_Production) alongside this, kept
  # around "in case a cell-manufacturing-specific report needs it later" —
  # but nothing in this pipeline's bq_views ever read it, and
  # raw_Part_v_Cell_Production is already owned and WRITE_TRUNCATE'd by the
  # separate inventory_activity pipeline (reports/inventory_activity.yaml),
  # on its own independent schedule. Two pipelines truncating the same table
  # is exactly the risk called out below for Part_v_Part — removed rather
  # than left as a live footgun for a report that doesn't exist yet.
  - plex_view: Part_v_Production
    bq_table: raw_Part_v_Production
    filter: ""
    date_col: Record_Date

# NOTE: Part_v_Part is intentionally NOT extracted here.
# raw_Part_v_Part is owned by the sales_orders pipeline (runs 7:00 PM Mountain).
# work_orders_view.sql references it as a shared table in the same dataset.
# Do not add Part_v_Part here — two WRITE_TRUNCATEs on the same table
# from different pipelines risk silently emptying it on a 0-row Plex response.
#
# raw_Part_v_Part_Product_Type (added 2026-08-19) is the same story — also
# owned/extracted by sales_orders, referenced as a shared table by
# mfg_job_schedule_view.sql for the real Product_Type classification
# (Vitamin/Mineral/Stock vs Custom Formula/etc.) that Part_Type alone
# doesn't provide.
#
# raw_Quality_v_Deviation_Job (added 2026-08-26, referenced by
# mfg_job_schedule_success_metrics_view.sql for the Deviation gate) is the
# same shared-table story again — owned/extracted by the
# quality_nonconformance pipeline (reports/quality_nonconformance.yaml),
# not re-extracted here.

# Three BigQuery reporting views over the same extractions above:
#   work_orders_report              — original, unchanged (job/op/workcenter/hours)
#   mfg_job_schedule_report         — added 2026-08-11: status text, operator
#                                     name, lot, QC checksheet status, equipment,
#                                     room. See docs/MFG_JOB_SCHEDULE_BUILD_PLAN.md.
#   labeling_open_work_orders_report — added 2026-08-11: Plex-native rebuild of
#                                     NetSuite's "Labeling | Open WO: Results"
#                                     saved search. See reports-list/production.md.
#   encap/blending/labeling/packaging_daily_report — added 2026-08-21: the
#                                     "Actual produced qty" half of the 4
#                                     Daily Reports Google Sheets, built on
#                                     Part_v_Cell_Production per the Daily
#                                     Shifts UI-report lead. See
#                                     reports-list/production.md.
#   bottling_job_schedule_report     — added 2026-08-22: Bottling Job
#                                     Schedule Google Sheet, one row per job
#                                     operation on a Bottling workcenter. See
#                                     spreadsheets/bottling_job_schedule.md.
#   mfg_job_schedule_success_metrics_report — added 2026-08-26: one row per
#                                     job, collapsing the "Done YTD"/"Done
#                                     2025"/"YTD List"/"2025 List" sub-tabs
#                                     into a single continuous view (Yield,
#                                     Total Days, Deviation, Success Rating).
#                                     mfg_job_schedule_fg_testing_pending_report
#                                     and mfg_job_schedule_gate_stats_report
#                                     both build on top of it — MUST be
#                                     listed before them below so the
#                                     retry-once pass in main() doesn't need
#                                     to kick in on every normal run. See
#                                     reports/sql/mfg_job_schedule_success_metrics_view.sql.
# The SQL files are loaded from GCS at runtime so they can be edited
# independently without touching this YAML. {gcp_project} and {dataset} in
# the SQL are replaced at runtime with the GCP_PROJECT and BQ_DATASET env vars.
bq_view:
  - name: work_orders_report
    display_name: "Work Orders"
    sql_file: gs://voxdatalake-report-configs/sql/work_orders_view.sql
  - name: mfg_job_schedule_report
    display_name: "MFG Job Schedule"
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_view.sql
  - name: labeling_open_work_orders_report
    display_name: "Labeling | Open WO: Results"
    sql_file: gs://voxdatalake-report-configs/sql/labeling_open_work_orders_view.sql
  - name: printing_open_work_orders_report
    display_name: "Printing Open Work Orders"
    sql_file: gs://voxdatalake-report-configs/sql/printing_open_work_orders_view.sql
  - name: encap_daily_report
    display_name: "Encap Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/encap_daily_report_view.sql
  - name: blending_daily_report
    display_name: "Blending Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/blending_daily_report_view.sql
  - name: labeling_daily_report
    display_name: "Labeling Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/labeling_daily_report_view.sql
  - name: packaging_daily_report
    display_name: "Packaging Daily Report"
    sql_file: gs://voxdatalake-report-configs/sql/packaging_daily_report_view.sql
  - name: bottling_job_schedule_report
    display_name: "Bottling Job Schedule"
    sql_file: gs://voxdatalake-report-configs/sql/bottling_job_schedule_view.sql
  - name: mfg_job_schedule_success_metrics_report
    display_name: "MFG Job Schedule - Success Metrics (Done/YTD List, unified)"
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_success_metrics_view.sql
  - name: mfg_job_schedule_fg_testing_pending_report
    display_name: "MFG Job Schedule - FG Testing Pending"
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_fg_testing_pending_view.sql
  - name: mfg_job_schedule_gate_stats_report
    display_name: "MFG Job Schedule - YTD Gate Stats"
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_gate_stats_view.sql
  - name: weekly_production_update_report
    display_name: "Weekly Production Update"
    sql_file: gs://voxdatalake-report-configs/sql/weekly_production_update_view.sql
