report_name: work_orders
description: "Work orders by workcenter — Vox Nutrition production report (PlexProd dataset)"

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO EDIT THIS REPORT (no deployment required):
#
#   Add a view    → add a new entry to extractions[], save this file to GCS
#   Change filter → update the filter field on the relevant entry, save to GCS
#   Change SQL    → edit reports/sql/work_orders_view.sql and save to GCS
#
# After saving, the next Cloud Run job execution picks up the changes automatically.
# Manual trigger: gcloud run jobs execute plex-etl-work-orders --region us-central1
# ─────────────────────────────────────────────────────────────────────────────

# NOTE: In Plex, "Work Orders" (Part_v_Work_Order) and "Jobs" (Part_v_Job) are
# separate entities — there is no direct FK between them in the ODBC views.
# Jobs are the shop-floor execution records that carry actual production data
# (qty per operation, times, workcenter assignments). This report uses Jobs.

extractions:
  # Job header — one row per production job (Job_No, part, qty, status, dates)
  - plex_view: Part_v_Job
    bq_table: raw_Part_v_Job
    filter: ""
    date_col: ""

  # Job operations — one row per workcenter step per job (qty, setup/run time, dates)
  - plex_view: Part_v_Job_Op
    bq_table: raw_Part_v_Job_Op
    filter: ""
    date_col: ""

  # Workcenter master — Name and Workcenter_Type are inline (no extra join needed)
  - plex_view: Part_v_Workcenter
    bq_table: raw_Part_v_Workcenter
    filter: ""
    date_col: ""

  # Workcenter log — actual hours logged by operators per job operation
  - plex_view: Part_v_Workcenter_Log
    bq_table: raw_Part_v_Workcenter_Log
    filter: ""
    date_col: ""

  # ── Added 2026-08-11 for mfg_job_schedule_report (see bq_view list below) ──

  # Job status lookup — resolves Job_Status_Key to text + Completed/Cancelled flags
  - plex_view: Part_v_Job_Status
    bq_table: raw_Part_v_Job_Status
    filter: ""
    date_col: ""

  # Employee master — resolves Job_Op.Started_By/Completed_By to an operator name
  - plex_view: Personnel_v_Employee
    bq_table: raw_Personnel_v_Employee
    filter: ""
    date_col: ""

  # Lot master — Job.Lot_Key joins here for lot number + manufactured date
  - plex_view: Part_v_Lot
    bq_table: raw_Part_v_Lot
    filter: ""
    date_col: ""

  # Lot shelf life — raw value only, see mfg_job_schedule_view.sql header for why
  # this isn't converted into an expiration date
  - plex_view: Part_v_Lot_Shelf_Life
    bq_table: raw_Part_v_Lot_Shelf_Life
    filter: ""
    date_col: ""

  # QC inspection records — Job_Op_Key joins directly, closest analog to the
  # manual tracker's "Raw Material in Testing" / "Raws Released" columns
  - plex_view: Quality_v_Checksheet
    bq_table: raw_Quality_v_Checksheet
    filter: ""
    date_col: ""

  # Checksheet status lookup — text label + Approved/Rejected/Expired flags
  - plex_view: Quality_v_Checksheet_Status
    bq_table: raw_Quality_v_Checksheet_Status
    filter: ""
    date_col: ""

  # Equipment/asset master — Workcenter_Key resolves an operation to its asset ID
  - plex_view: Maintenance_v_Equipment
    bq_table: raw_Maintenance_v_Equipment
    filter: ""
    date_col: ""

  # Building master — Job.Building_Key resolves to a room/building name
  - plex_view: Common_v_Building
    bq_table: raw_Common_v_Building
    filter: ""
    date_col: ""

# NOTE: Part_v_Part is intentionally NOT extracted here.
# raw_Part_v_Part is owned by the sales_orders pipeline (runs at 2 AM).
# work_orders_view.sql references it as a shared table in the same dataset.
# Do not add Part_v_Part here — two WRITE_TRUNCATEs on the same table
# from different pipelines risk silently emptying it on a 0-row Plex response.

# Three BigQuery reporting views over the same extractions above:
#   work_orders_report              — original, unchanged (job/op/workcenter/hours)
#   mfg_job_schedule_report         — added 2026-08-11: status text, operator
#                                     name, lot, QC checksheet status, equipment,
#                                     room. See docs/MFG_JOB_SCHEDULE_BUILD_PLAN.md.
#   labeling_open_work_orders_report — added 2026-08-11: Plex-native rebuild of
#                                     NetSuite's "Labeling | Open WO: Results"
#                                     saved search. See reports-list/production.md.
# The SQL files are loaded from GCS at runtime so they can be edited
# independently without touching this YAML. {gcp_project} and {dataset} in
# the SQL are replaced at runtime with the GCP_PROJECT and BQ_DATASET env vars.
bq_view:
  - name: work_orders_report
    sql_file: gs://voxdatalake-report-configs/sql/work_orders_view.sql
  - name: mfg_job_schedule_report
    sql_file: gs://voxdatalake-report-configs/sql/mfg_job_schedule_view.sql
  - name: labeling_open_work_orders_report
    sql_file: gs://voxdatalake-report-configs/sql/labeling_open_work_orders_view.sql
